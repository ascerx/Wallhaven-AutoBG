name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: 'Generate a new Android upload keystore (first-time setup for Play Store)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.generate_keystore == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android upload keystore
        run: |
          keytool -genkeypair -v \
            -keystore wallhaven-upload.jks \
            -alias wallhaven \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -dname "CN=Wallhaven AutoBG, OU=ascerx, O=ascerx, C=ES"
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: wallhaven-upload.jks

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Bundle VC++ runtime DLLs (portable without redistributable)
        shell: pwsh
        run: |
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item "C:\Windows\System32\$dll" 'build/windows/x64/runner/Release/' -ErrorAction SilentlyContinue
          }
      - name: Build single-exe installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" 'packaging/installer.iss'
      - name: Sign Windows binaries (optional - needs WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD secrets)
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            'build/windows/x64/runner/Release/wallhaven_client.exe'
          & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "packaging/installer/Wallhaven-AutoBG-Setup-*.exe"
          Remove-Item $pfx -Force
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'wallhaven-autobg-windows-portable.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            packaging/installer/Wallhaven-AutoBG-Setup-*.exe
            wallhaven-autobg-windows-portable.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/installer/Wallhaven-AutoBG-Setup-*.exe
            wallhaven-autobg-windows-portable.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Prepare Android signing (optional - needs ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD secrets)
        if: env.ANDROID_KEYSTORE != ''
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${ANDROID_KEYSTORE}" | base64 -d > android/app/wallhaven-upload.jks
          cat > android/key.properties <<EOF
          storeFile=wallhaven-upload.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=wallhaven
          keyPassword=${ANDROID_KEYSTORE_PASSWORD}
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Build Android App Bundle (Play Store)
        run: flutter build appbundle --release
      - name: Rename APK and AAB
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk wallhaven-autobg_${VER}_android.apk
          cp build/app/outputs/bundle/release/app-release.aab wallhaven-autobg_${VER}_android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            wallhaven-autobg_*_android.apk
            wallhaven-autobg_*_android.aab
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wallhaven-autobg_*_android.apk
            wallhaven-autobg_*_android.aab

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
      - run: flutter pub get
      - run: flutter test
      - name: Patch hotkey_manager_linux uninitialized variables
        shell: bash
        run: |
          CACHE="$HOME/.pub-cache/hosted/pub.dev"
          sed -i 's/const char\* identifier;/const char* identifier = nullptr;/' "$CACHE"/hotkey_manager_linux-*/linux/hotkey_manager_linux_plugin.cc
          sed -i 's/const char\* keystring;/const char* keystring = nullptr;/' "$CACHE"/hotkey_manager_linux-*/linux/hotkey_manager_linux_plugin.cc
      - run: flutter build linux --release
      - name: Package .deb
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          mkdir -p pkg/DEBIAN pkg/opt/wallhaven-client pkg/usr/share/applications
          cp -r build/linux/x64/release/bundle/* pkg/opt/wallhaven-client/
          cp assets/icon.png pkg/opt/wallhaven-client/icon.png
          cat > pkg/usr/share/applications/wallhaven-autobg.desktop <<'EOF'
          [Desktop Entry]
          Name=Wallhaven AutoBG
          Comment=Rotación automática de fondos con wallhaven.cc
          Exec=/opt/wallhaven-client/wallhaven_client
          Icon=/opt/wallhaven-client/icon.png
          Type=Application
          Categories=Graphics;
          EOF
          cat > pkg/DEBIAN/control <<'EOF'
          Package: wallhaven-autobg
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: ascerx
          Depends: libgtk-3-0, libglib2.0-0, libstdc++6
          Description: Cliente de Wallhaven con rotación automática de fondos
           Busca wallpapers en wallhaven.cc, los descarga y cambia tu fondo de
           escritorio automáticamente.
          EOF
          sed -i "s/^Version:.*/Version: ${VER}/" pkg/DEBIAN/control
          echo "Package: wallhaven-autobg" > pkg/DEBIAN/control
          echo "Version: ${VER}" >> pkg/DEBIAN/control
          echo "Section: graphics" >> pkg/DEBIAN/control
          echo "Priority: optional" >> pkg/DEBIAN/control
          echo "Architecture: amd64" >> pkg/DEBIAN/control
          echo "Maintainer: ascerx" >> pkg/DEBIAN/control
          echo "Depends: libgtk-3-0, libglib2.0-0, libstdc++6, libayatana-appindicator3-1, libkeybinder-3.0-0" >> pkg/DEBIAN/control
          echo "Description: Cliente de Wallhaven con rotación automática de fondos" >> pkg/DEBIAN/control
          echo " Busca wallpapers en wallhaven.cc, los descarga y cambia tu fondo de escritorio automáticamente." >> pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group pkg wallhaven-autobg_${VER}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: wallhaven-autobg_*_amd64.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wallhaven-autobg_*_amd64.deb
